site_name: PyPlasmode
site_url: https://bradsegal.github.io/PyPlasmode/
site_description: Simulate outcomes from your feature data and evaluate prediction and feature selection
repo_url: https://github.com/BradSegal/PyPlasmode
theme: readthedocs
nav:
  - Getting started: index.md
  - Feature-selection tutorial: tutorial.md
  - Visual gallery: gallery.md
  - Methods: methods.md
  - Generating signals: truths.md
  - Outcomes: outcomes.md
  - Evaluation: evaluation.md
  - Extensions: structures-and-extensions.md
  - Validation: validation.md
  - API: api.md
  - Data handling: privacy-and-limitations.md
  - References: references.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            show_source: false
            filters: ["!^_"]
markdown_extensions:
  - admonition
  - tables
