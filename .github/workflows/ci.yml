name: Library checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: library-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.12', dependencies: minimum}
          - {os: ubuntu-latest, python: '3.13', dependencies: current}
          - {os: ubuntu-latest, python: '3.14', dependencies: current}
          - {os: windows-latest, python: '3.13', dependencies: current}
          - {os: macos-latest, python: '3.13', dependencies: current}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - if: matrix.dependencies == 'minimum'
        run: python -m pip install "numpy==2.0.2" "scipy==1.14.1" "scikit-learn==1.6.1"
      - run: python -m pip install ".[validation]" pytest
      - run: python -m pytest -q
      - run: python examples/quickstart.py
      - run: python examples/survival.py
      - run: python examples/custom_signal.py
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[validation]" --group dev --group docs
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/pyplasmode
      - run: mkdocs build --strict
      - run: python -m build
      - run: twine check --strict dist/*
      - run: check-wheel-contents dist/*.whl
      - name: Test the installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv consumer
          consumer/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl pytest statsmodels
          consumer/bin/python -I -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/tests" -q
